<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Primer Control del Impulso™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EDE3;
    --cream-2:#EFE2D0;
    --clay-deep:#8A3E22;
    --ink:#6B3420;
    --ink-soft:#7A5240;
    --card:#FBF6EF;
    --card-line: rgba(107,52,32,0.14);
    --sage:#6F7D4C;
    --sage-bg:#EDF0E1;
    --sage-line: rgba(111,125,76,0.3);
    --berry:#8B2F45;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--cream); font-family:'Sora', sans-serif; color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:440px; width:100%; text-align:center; background:var(--card);
    border:1px solid var(--card-line); border-radius:24px; padding:clamp(36px,7vw,52px);
    box-shadow:0 24px 50px -20px rgba(107,52,32,0.25);
  }
  .icon{
    width:60px; height:60px; margin:0 auto 20px; border-radius:16px;
    background:var(--cream-2); color:var(--clay-deep);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:28px; height:28px; }
  .badge{
    display:inline-block; background:var(--sage-bg); color:#52603A; border:1px solid var(--sage-line);
    border-radius:100px; padding:6px 16px; font-size:0.8rem; font-weight:700; letter-spacing:0.02em;
    text-transform:uppercase; margin-bottom:16px;
  }
  h1{ font-family:'Fraunces', serif; font-weight:700; font-size:1.4rem; color:var(--berry); margin-bottom:12px; }
  p{ font-size:0.96rem; color:var(--ink-soft); line-height:1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
    </div>
    <span class="badge">Próximamente</span>
    <h1>Tu Primer Control del Impulso™</h1>
    <p>La herramienta interactiva se construirá en la siguiente fase. Vuelve pronto.</p>
  </div>
</body>
</html>
